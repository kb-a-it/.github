name: 버그 신고
description: 정상적으로 동작하지 않는 문제를 등록할 때 사용합니다.
title: "[BUG] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        재현 가능한 정보와 실제 결과를 구체적으로 작성해 주세요.
        로그나 화면을 첨부할 때는 개인정보와 비밀값을 제거해 주세요.

  - type: input
    id: summary
    attributes:
      label: 버그 요약
      description: 문제를 한 문장으로 작성해 주세요.
      placeholder: 예) 추천 결과 조회 시 같은 동네가 중복으로 표시됨
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 발생 영역
      options:
        - Frontend
        - Backend
        - Frontend와 Backend 연동
        - Database
        - 외부 API
        - 개발 환경 및 배포
        - 확인 필요
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 현재 어떤 문제가 발생하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상이라면 어떻게 동작해야 하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 다른 팀원이 같은 문제를 재현할 수 있도록 순서대로 작성해 주세요.
      placeholder: |
        1. 로그인한다.
        2. 추천 조건을 입력한다.
        3. 추천 결과 조회 버튼을 누른다.
        4. 동일한 행정동이 두 번 표시된다.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 브랜치, 브라우저, Java 버전, 실행 환경 등 관련 정보를 작성해 주세요.
      placeholder: |
        - 브랜치:
        - 브라우저:
        - Java:
        - 실행 환경:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 로그 및 화면
      description: 오류 메시지, 로그, 요청·응답 또는 스크린샷을 첨부해 주세요.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 추가 정보
      description: 원인으로 예상되는 부분, 임시 해결 방법 또는 관련 Issue를 작성해 주세요.
    validations:
      required: false

  - type: checkboxes
    id: security-check
    attributes:
      label: 확인 사항
      options:
        - label: 첨부한 로그와 화면에서 비밀번호, 토큰, API Key 및 개인정보를 제거했습니다.
          required: true
