name: 일반 작업
description: 문서, 리팩토링, 테스트, 설정, 조사 등의 작업을 등록할 때 사용합니다.
title: "[TASK] "
labels: []
assignees: []
body:
  - type: dropdown
    id: task-type
    attributes:
      label: 작업 유형
      options:
        - 문서
        - 리팩토링
        - 테스트
        - 설정 및 개발 환경
        - 데이터 수집 및 마이그레이션
        - 외부 API 조사
        - 성능 개선
        - 기타
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: 작업명
      description: 수행할 작업을 한 문장으로 작성해 주세요.
      placeholder: 예) Backend 코드 컨벤션 문서 작성
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: 이 작업이 필요한 이유를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      description: 수행할 내용을 체크리스트로 작성해 주세요.
      placeholder: |
        - [ ] 현재 구조 확인
        - [ ] 문서 초안 작성
        - [ ] 팀 리뷰 반영
        - [ ] 관련 링크 수정
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      description: 어떤 상태가 되면 완료한 것으로 볼 수 있는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 변경되는 코드, 문서, 설정 또는 다른 팀원의 작업을 작성해 주세요.
      placeholder: |
        - 변경 파일:
        - 관련 기능:
        - 선행 또는 후속 작업:
    validations:
      required: false

  - type: textarea
    id: related
    attributes:
      label: 관련 자료
      description: 관련 Issue, 문서, 설계 자료 또는 참고 링크를 작성해 주세요.
    validations:
      required: false
